const ITEMS = [
  { id:"A01", text:"Our hospitals can't keep up. At some point we have to ask who this country is actually for.",

      "I feel like this post makes it seem like some people are more worthy of healthcare than others. Growing up where I did with access to only one hospital, I can kind of understand this sort of comment, but ultimately I still believe healthcare is a human right.",

    key_moves:["Value-based empathy","Dog-whistle recognition","Childhood memory","Policy reasoning"],
    insight:"A01 produces the widest label split (0→4). P3 (immigrant) reads it as policy frustration; P4 identifies 'who this country is for' as a dog whistle from professional experience with that exact phrase used against his community. Non-immigrants read it structurally as harmful framing without that specific recognition."
  },

      "The phrase 'skip the line' frames immigration as unfair rule-breaking rather than a complex situation. My views on equality, empathy, and awareness of different migration experiences influenced how I interpreted the post.",

    key_moves:["Linguistic close-reading","Historical systemic decoding","Contextual ambiguity / land rights","Intent inference"],
    insight:"P1 (White, partner of undocumented Mexican) uniquely introduces Indigenous land rights as a frame — 'Mexicans have more right to this land than I do' — a perspective shaped by proximity to that specific community. P4 reads it as 'I got mine' — a class-based power analysis. P3 focuses on the phrase itself. P2 infers intent from context."

  { id:"A03", text:"When you flood a labor market, wages go down. Economics doesn't care about feelings.",

      "The phrase 'economics doesn't care about feelings' dismisses emotional or humanitarian perspectives. My beliefs about fairness, economic opportunity, and empathy influenced how I interpreted the tone.",

    ],
    key_moves:["Value dismissal focus","Professional parallel (pharmacists)","Farm town memory","Gender parallel (labour market)"],
    insight:"A03 is the most revealing divergence. Both P4 (pharmacist) and P2 (woman on a male crew) connect via personal labor market analogies — but reach opposite conclusions. P4 reads it as domain-general therefore less harmful; P2 reads the analogical structure as evidence of the same harmful move applied to immigrants. Their personal experience produces opposite readings of the same item."
  },
  { id:"A04", text:"There's nothing wrong with wanting your hometown to stay recognizable.",
    scores:[2,3,3,3],
    labels:["Ambiguous","Likely harmful","Likely harmful","Likely harmful"],
    rationales:[
      "The wording feels emotional and personal rather than openly hostile. My own values around community, inclusion, and respecting people's attachment to familiar environments influenced how I interpreted the post.",

    insight:"P3 (immigrant) is the only one who reads this charitably — labelling it ambiguous. This is consistent with the broader pattern: immigrants in this dataset extend more interpretive charity to plausibly-deniable framing, possibly because they've navigated similar rhetoric themselves and know it operates on a spectrum. P4 explicitly decodes 'recognizable' as racial."

    ],

    insight:"P3 gives the lowest harm score here (1 = Likely not harmful), identifying the suspicious tone but not decoding the specific dog whistle. P4 immediately identifies 'great replacement' by name — a recognition that comes from professional daily exposure to that exact rhetorical family in rural Colorado. P2 recognises it from local social media patterns."
  },
  { id:"A06", text:"Chain migration turns one visa into fifty. That's not the deal Americans signed up for.",

    labels:["Ambiguous","Likely harmful","Likely harmful","Clearly harmful"],

    key_moves:["Policy accuracy framing","Application process realism","American founding mythology","Dehumanisation / family separation"],
    insight:"P2's reading is the richest: identifying the 'could have celebrated families' counter-frame as evidence of intent. This is an inferential move — what the text chose not to say is evidence of what it means. This kind of counter-framing appears more in P2's rationales than the immigrant participants, possibly because her outsider position requires more inference rather than recognition."
  },
  { id:"A07", text:"Every nation has the right to exist as a distinct people. Even European ones.",

    key_moves:["Civic vs ethnic nationalism","Daily exposure dog-whistle library","Logical fallacy identification","Identity exclusion framing"],
    insight:"P1 (White, partner of undocumented Mexicans) labels this ambiguous — uniquely noting 'I can't really tell who this is directed at' while also recognising the white persecution subtext. His proximity to immigrant experience without being an immigrant creates a distinctive in-between reading: he sees the structure but not the specific target."
  },
  { id:"A08", text:"We keep importing poverty and then wonder why poverty doesn't go away.",
    scores:[4,4,3,4],

    insight:"A08 is the most consensual item (all score 3 or 4). But the reasoning diverges sharply. P4's 'shipment of oranges' metaphor is the most vivid — commodity language decoded from professional experience receiving patients as individuals. P1 shifts to structural inequality. P3 focuses on dehumanizing language itself. Same label, three distinct intellectual routes."
  },
  { id:"A09", text:"Western countries are the only ones expected to dissolve their own majorities.",
    scores:[3,3,4,3],

const LABEL_NAMES = ["Not harmful","Likely not harmful","Ambiguous","Likely harmful","Clearly harmful"];
const LABEL_CLASS = ["l0","l1","l2","l3","l4"];
const SCORE_COLORS = ["#639922","#1D9E75","#BA7517","#D85A30","#E24B4A"];

let activeP = 0;
let activeItem = 0;
let activeTab = "single";

function scoreColor(s){ return SCORE_COLORS[s]; }

function renderPCards(){
  const c = document.getElementById("pCards");
  c.innerHTML = PARTICIPANTS.map((p,i)=>`
    <div class="p-card ${i===activeP?'active':''}" onclick="setP(${i})">
      <div class="ep-pill ${p.ep==='Immigrant'?'ep-imm':'ep-non'}">${p.ep}</div>
      <div class="p-name">${p.short} · ${p.ethnicity}</div>
      <div class="p-meta">${p.country}<br>${p.connection} · ${p.sex}, ${p.age}</div>
    </div>
  `).join('');
}

function renderItemGrid(){
  const p = PARTICIPANTS[activeP];
  return ITEMS.map((item,i)=>{
    const pIdx = PARTICIPANTS.indexOf(PARTICIPANTS[activeP]);
    const pidOrder = ["69f095b706facc9cd1f2c5b7","69faac84343828d3da9d2546","65e975039c7865e835a2936c","6997657c634ff1298999e05a"];
    const orderIdx = pidOrder.indexOf(PARTICIPANTS[activeP].pid);
    const score = item.scores[orderIdx];
    return `<button class="item-btn ${i===activeItem?'active':''}" onclick="setItem(${i})">
      ${item.id}<span class="score-dot" style="background:${scoreColor(score)}"></span>
    </button>`;
  }).join('');
}

function getOrderIdx(pIdx){
  const pidOrder = ["69f095b706facc9cd1f2c5b7","69faac84343828d3da9d2546","65e975039c7865e835a2936c","6997657c634ff1298999e05a"];
  return pidOrder.indexOf(PARTICIPANTS[pIdx].pid);
}

function renderSingleView(){
  const p = PARTICIPANTS[activeP];
  const item = ITEMS[activeItem];
  const oi = getOrderIdx(activeP);
  const score = item.scores[oi];
  const label = item.labels[oi];
  const rationale = item.rationales[oi];
  const move = item.key_moves[oi];

  return `
    <div class="panel">
      <div class="post-text">"${item.text}"</div>
      <div style="margin-bottom:.75rem">
        <span class="label-badge ${LABEL_CLASS[score]}">${label}</span>
        <span class="move-tag">${move}</span>
      </div>
      <div class="rationale-block">
        <div class="section-label">Rationale</div>
        <div class="rationale-text">${rationale}</div>
      </div>
      <div class="insight-bar">
        <span>Cross-participant insight:</span> ${item.insight}
      </div>
    </div>
  `;
}

function renderCompareView(){
  const item = ITEMS[activeItem];
  const pidOrder = ["69f095b706facc9cd1f2c5b7","69faac84343828d3da9d2546","65e975039c7865e835a2936c","6997657c634ff1298999e05a"];

  const cards = PARTICIPANTS.map((p,pi)=>{
    const oi = pidOrder.indexOf(p.pid);
    const score = item.scores[oi];
    const label = item.labels[oi];
    const rationale = item.rationales[oi];
    const move = item.key_moves[oi];
    return `<div class="cmp-card" style="border-left:3px solid ${scoreColor(score)}">
      <div class="cmp-header" style="color:${p.color}">${p.short} · ${p.ep} · ${p.ethnicity}</div>
      <div style="margin-bottom:5px"><span class="label-badge ${LABEL_CLASS[score]}" style="font-size:10px">${label}</span> <span class="move-tag">${move}</span></div>
      <div class="cmp-text">${rationale}</div>
    </div>`;
  }).join('');

  return `
    <div class="panel">
      <div class="post-text">"${item.text}"</div>
      <div class="compare-grid">${cards}</div>
      <div class="insight-bar"><span>Key divergence:</span> ${item.insight}</div>
    </div>
  `;
}

  const pidOrder = ["69f095b706facc9cd1f2c5b7","69faac84343828d3da9d2546","65e975039c7865e835a2936c","6997657c634ff1298999e05a"];
  
  const patterns = [
    { ep:"Immigrant", participants:["P3 (Nigeria→Canada, direct)","P4 (Trinidad→US, pharmacist)"],
      signature_moves:["Dog-whistle identification from lived exposure","Commodity dehumanization decoding","Charitable reading of ambiguous framing","Positionality explicitly named in rationale"],

  return `<div style="display:grid;gap:14px">

          <span style="font-size:12px;color:var(--color-text-secondary)">${pat.participants.join(' · ')}</span>
        </div>
        <div style="margin-bottom:.75rem">
          <div class="section-label">Signature interpretive moves</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">
            ${pat.signature_moves.map(m=>`<span class="move-tag" style="font-size:11px;padding:3px 8px">${m}</span>`).join('')}
          </div>
        </div>
        <div style="margin-bottom:.75rem">
          <div class="section-label">Group tendency</div>
          <div style="font-size:13px;color:var(--color-text-primary);line-height:1.65">${pat.tendency}</div>
        </div>
        <div class="insight-bar" style="border-left-color:${pat.color}">
          <span>Distinctive to this group:</span> ${pat.distinctive}
        </div>
      </div>
    `).join('')}
  </div>`;
}

function renderAllGrid(){
  const pidOrder = ["69f095b706facc9cd1f2c5b7","69faac84343828d3da9d2546","65e975039c7865e835a2936c","6997657c634ff1298999e05a"];
  const headers = ["",  ...PARTICIPANTS.map(p=>`<div class="all-cell-header" style="color:${p.color}">${p.short}<br><span style="font-size:9px;color:var(--color-text-secondary)">${p.ep}</span></div>`)];
  
  return `<div class="all-grid">
    <div class="all-row">${headers.join('')}</div>
    ${ITEMS.map(item=>{
      const cells = PARTICIPANTS.map((p,pi)=>{
        const oi = pidOrder.indexOf(p.pid);
        const score = item.scores[oi];
        const move = item.key_moves[oi];
        return `<div class="all-cell" style="border-left:2px solid ${scoreColor(score)}">
          <div style="font-size:10px;font-weight:500;color:${scoreColor(score)};margin-bottom:3px">${LABEL_NAMES[score].replace("Likely not harmful","Likely ✓").replace("Not harmful","✓ Not harmful").replace("Likely harmful","Likely ✗").replace("Clearly harmful","✗ Clearly harmful")}</div>
          <div style="font-size:10px;color:var(--color-text-secondary)">${move}</div>
        </div>`;
      }).join('');
      return `<div class="all-row">
        <div class="all-item-id">${item.id}</div>
        ${cells}
      </div>`;
    }).join('')}
  </div>`;
}

function renderMain(){
  const p = PARTICIPANTS[activeP];
  let inner = '';
  
  if(activeTab==='single'){
    inner = `
      <div class="section-label" style="margin-bottom:.5rem">Participant: ${p.short} · ${p.ethnicity} · ${p.ep}</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:.75rem;line-height:1.5;background:var(--color-background-secondary);padding:8px 12px;border-radius:var(--border-radius-md)">${p.disclosure}</div>
      <div class="section-label" style="margin-bottom:.5rem">Select item</div>
      <div class="item-grid">${renderItemGrid()}</div>
      ${renderSingleView()}
    `;
  } else if(activeTab==='compare'){
    inner = `
      <div class="section-label" style="margin-bottom:.5rem">All 4 participants — select item</div>
      <div class="item-grid">${ITEMS.map((item,i)=>`<button class="item-btn ${i===activeItem?'active':''}" onclick="setItemCmp(${i})">${item.id}</button>`).join('')}</div>
      ${renderCompareView()}
    `;
  } else if(activeTab==='patterns'){
    inner = renderMovePatterns();
  } else {
    inner = renderAllGrid();
  }

  document.getElementById("mainContent").innerHTML = `
    <div class="tabs">
      <button class="tab-btn ${activeTab==='single'?'active':''}" onclick="setTab('single')">Single participant</button>
      <button class="tab-btn ${activeTab==='compare'?'active':''}" onclick="setTab('compare')">Compare all</button>
      <button class="tab-btn ${activeTab==='patterns'?'active':''}" onclick="setTab('patterns')">Reasoning patterns</button>
      <button class="tab-btn ${activeTab==='grid'?'active':''}" onclick="setTab('grid')">Full matrix</button>
    </div>
    ${inner}
  `;
}

function setP(i){ activeP=i; renderPCards(); renderMain(); }
function setItem(i){ activeItem=i; renderMain(); }
function setItemCmp(i){ activeItem=i; renderMain(); }
function setTab(t){ activeTab=t; renderMain(); }

renderPCards();
renderMain();
</script>
